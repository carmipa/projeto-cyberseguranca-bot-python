services:
  cyber-bot:
    build: .
    container_name: cyber-intel-bot
    restart: always
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    # DNS Google (8.8.8.8 / 8.8.4.4) para evitar bloqueios de DNS na VPS
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"  # Web Dashboard + API (trigger_scan, sync_from_discord) para vps_api
    volumes:
      # Dados persistentes (JSONs de estado e histórico)
      - ./data:/app/data
      # Logs do sistema
      - ./logs:/app/logs
      # Configuração (opcional - será criado automaticamente se não existir)
      # O bot usa load_json_safe que retorna {} se o arquivo não existir
    networks:
      - cyber-network
    # Limites de recursos para bot de varredura
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 512M
        reservations:
          memory: 256M
    cpus: 0.80
    mem_limit: 512m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; import discord; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vps-api:
    build: .
    container_name: cyber-vps-api
    restart: always
    environment:
      - VPS_API_DATA_DIR=/app/data
      - BOT_HOST=cyber-bot
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "vps_api:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - cyber-network
    depends_on:
      - cyber-bot
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    cpus: 0.50
    mem_limit: 384m
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nodered:
    image: nodered/node-red:latest
    container_name: cyber-nodered
    restart: always
    user: "root"
    environment:
      - NODE_RED_ENABLE_PROJECTS=false
      - NODE_RED_ENABLE_SAFE_MODE=false
      - FLOWS=flows.json
    ports:
      - "1880:1880"
    volumes:
      - ./node-red-data:/data
    command: >
      bash -c "if [ ! -d /data/node_modules/node-red-dashboard ]; then npm install --prefix /data --no-audit --no-update-notifier node-red-dashboard; fi && /usr/src/node-red/entrypoint.sh"
    networks:
      - cyber-network
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 512M
    cpus: 0.80
    mem_limit: 512m
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:1880',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cyber-network:
    driver: bridge
