services:
  cyber-bot:
    build: .
    container_name: cyber-intel-bot
    restart: always
    env_file:
      - .env
    # DNS Google (8.8.8.8 / 8.8.4.4) para evitar bloqueios de DNS na VPS
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"  # Web Dashboard + API (trigger_scan, sync_from_discord) para vps_api
    volumes:
      # Dados persistentes (JSONs de estado e histórico)
      - ./data:/app/data
      # Logs do sistema
      - ./logs:/app/logs
      # Configuração (opcional - será criado automaticamente se não existir)
      # O bot usa load_json_safe que retorna {} se o arquivo não existir
    networks:
      - cyber-network
    # Limites de recursos para bot de varredura
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  vps-api:
    build: .
    container_name: cyber-vps-api
    restart: always
    environment:
      - VPS_API_DATA_DIR=/app/data
      - BOT_HOST=cyber-bot
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "vps_api:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - cyber-network
    depends_on:
      - cyber-bot

  nodered:
    image: nodered/node-red:latest
    container_name: cyber-nodered
    restart: always
    user: "root"
    environment:
      - NODE_RED_ENABLE_PROJECTS=false
      - NODE_RED_ENABLE_SAFE_MODE=false
      - FLOWS=flows.json
    ports:
      - "1880:1880"
    volumes:
      - ./node-red-data:/data
    command: >
      bash -c "npm install --prefix /data --no-audit --no-update-notifier node-red-dashboard && /usr/src/node-red/entrypoint.sh"
    networks:
      - cyber-network

networks:
  cyber-network:
    driver: bridge
