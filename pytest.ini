[pytest]
# So tests/ e coletado: scripts/ tem sys.exit() no import e derrubava a sessao
# inteira com INTERNALERROR (linha de base medida em 2026-09-26: 0 testes).
testpaths = tests
python_files = test_*.py
asyncio_mode = strict
markers =
    network: acessa servico externo real (NVD, feeds); fora da suite padrao
addopts = -m "not network"
# Catraca: teste que faz `return X` em vez de `assert` passa sempre no pytest.
# 13 "testes" deste bot eram assim; nenhum novo pode nascer incapaz de reprovar.
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
