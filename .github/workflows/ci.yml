name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # mesma versão da imagem de produção
      - name: Dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio flake8 bandit pip-audit
      # pytest primeiro: vermelho de estilo escondendo ausência de teste é pior
      # que vermelho de teste. Cada passo roda mesmo se o anterior falhar.
      - name: pytest
        if: always()
        run: python -m pytest -q
      - name: flake8 (erros fatais)
        if: always()
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --exclude=.venv,scratch --show-source
      - name: bandit (Medium+)
        if: always()
        run: python -m bandit -q -ll -r app bot core src utils web
      - name: pip-audit (os dois manifestos)
        if: always()
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r deploy/requirements.txt
